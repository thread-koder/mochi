# Sample layout for Mochi configuration. Nothing reads this file unless you list it in MOCHI_CONFIG_FILES
# (comma-separated paths, first file is the base, later files override). Otherwise defaults plus MOCHI_* env apply.

log:
  level: "info" # debug | info | warn | error
  format: "console" # json | console

api:
  host: "0.0.0.0"
  port: 8080
  read_timeout: 30 # seconds
  write_timeout: 30 # seconds
  mode: "release" # debug | release | test

database:
  host: "localhost"
  port: 5432
  user: "mochi"
  password: ""
  database: "mochi"
  ssl_mode: "disable" # disable | require | verify-ca | verify-full
  max_connections: 25
  min_idle_conns: 5
  conn_max_lifetime: 3600 # seconds
  conn_max_idle_time: 1800 # seconds
  tls:
    enabled: false
    insecure_skip_verify: false
    root_ca_path: ""
    client_cert_path: ""
    client_key_path: ""

kubernetes:
  kubeconfig_path: "" # empty: default discovery (~/.kube/config or KUBECONFIG)
  in_cluster: false # true for in-cluster client config
  cluster_name: "Kubernetes Cluster"
  request_timeout: 30 # seconds
  qps: 50
  burst: 100
  # Optional. Extra pod/Service CIDRs when cluster leftovers are mislabeled as External.
  # Leave empty unless that happens. service_cidrs is the ClusterIP range.
  pod_cidrs: []
  service_cidrs: []

prometheus:
  url: "http://localhost:9090"
  timeout: 30 # seconds
  tls:
    enabled: false
    insecure_skip_verify: false
    root_ca_path: ""
    client_cert_path: ""
    client_key_path: ""

redis:
  host: "localhost"
  port: 6379
  username: ""
  password: ""
  database: 0 # 0–15
  max_retries: 3
  pool_size: 10
  min_idle_conns: 5
  conn_max_lifetime: 3600 # seconds
  conn_max_idle_time: 1800 # seconds
  cache_ttl: 300 # seconds
  tls:
    enabled: false
    insecure_skip_verify: false
    root_ca_path: ""
    client_cert_path: ""
    client_key_path: ""

workers:
  sync:
    interval: 120 # seconds
    exclude_namespaces:
      - "default"
      - "kube-public"
      - "kube-node-lease"
    include_namespaces: [] # if non-empty, only these namespaces (exclude_namespaces ignored)
  retention:
    interval: 86400 # seconds
    max_age: 90 # days - delete records older than this
