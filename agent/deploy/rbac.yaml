apiVersion: v1
kind: ServiceAccount
metadata:
  name: mochi-agent
  namespace: mochi-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mochi-agent
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mochi-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mochi-agent
subjects:
  - kind: ServiceAccount
    name: mochi-agent
    namespace: mochi-system
