<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - Mochi</title>
    
    <!-- Tailwind CSS v4 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
    <!-- Chart.js Time Adapter -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.bunny.net">
    <link href="https://fonts.bunny.net/css?family=jetbrains-mono:100,200,300,400,500,600,700,800" rel="stylesheet" />

    <!-- Iconify -->
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>

    <!-- Tailwind Custom Theme -->
    <style type="text/tailwindcss">
        @theme static {
            /* Font */
            --font-sans: 'JetBrains Mono', 'Courier New', monospace;
            
            /* Light Theme Palette (Default) */
            /* Base colors */
            --color-primary: var(--color-purple-600);
            --color-secondary: var(--color-cyan-600);
            --color-tertiary: var(--color-pink-600);
            --color-success: var(--color-green-600);
            --color-error: var(--color-red-600);
            --color-warning: var(--color-amber-600);
            --color-info: var(--color-blue-600);
            
            /* Light colors */
            --color-primary-light: var(--color-purple-500);
            --color-secondary-light: var(--color-cyan-500);
            --color-tertiary-light: var(--color-pink-500);
            --color-success-light: var(--color-green-500);
            --color-error-light: var(--color-red-500);
            --color-warning-light: var(--color-amber-500);
            --color-info-light: var(--color-blue-500);
            
            /* Surface Colors (Backgrounds) */
            --color-surface: var(--color-slate-50);
            --color-surface-elevated: var(--color-slate-100);
            
            /* On-Surface Colors */
            --color-on-surface: var(--color-slate-900);
            --color-on-surface-secondary: var(--color-slate-800);
            --color-on-surface-subtle: var(--color-slate-700);
            --color-on-surface-muted: var(--color-slate-600);
        }

        /* Dark Theme Palette */
        .dark {
            /* Base colors */
            --color-primary: var(--color-purple-400);
            --color-secondary: var(--color-cyan-400);
            --color-tertiary: var(--color-pink-400);
            --color-success: var(--color-green-400);
            --color-error: var(--color-red-400);
            --color-warning: var(--color-amber-400);
            --color-info: var(--color-blue-400);
            
            /* Light colors */
            --color-primary-light: var(--color-purple-300);
            --color-secondary-light: var(--color-cyan-300);
            --color-tertiary-light: var(--color-pink-300);
            --color-success-light: var(--color-green-300);
            --color-error-light: var(--color-red-300);
            --color-warning-light: var(--color-amber-300);
            --color-info-light: var(--color-blue-300);
            
            /* Surface Colors (Backgrounds) */
            --color-surface: var(--color-slate-950);
            --color-surface-elevated: var(--color-slate-900);
            
            /* On-Surface Colors */
            --color-on-surface: var(--color-slate-100);
            --color-on-surface-secondary: var(--color-slate-200);
            --color-on-surface-subtle: var(--color-slate-300);
            --color-on-surface-muted: var(--color-slate-400);
        }
        
        @layer base {
            /* Custom scrollbar */
            ::-webkit-scrollbar {
                width: 8px;
                height: 8px;
            }
            ::-webkit-scrollbar-track {
                background: var(--color-surface-elevated);
            }
            ::-webkit-scrollbar-thumb {
                background: var(--color-primary);
                border-radius: 4px;
            }
            ::-webkit-scrollbar-thumb:hover {
                background: var(--color-primary-light);
            }
        }
        
        @layer components {
            /* Glassmorphism effect */
            .glass {
                background-color: rgb(from var(--color-surface-elevated) r g b / 80%);
                backdrop-filter: blur(10px);
                border: 1px solid rgb(from var(--color-primary) r g b / 20%);
            }
        }
    </style>
    
    <!-- Global CSS -->
    <link rel="stylesheet" href="/static/css/global.css">
    
    <!-- Animations -->
    <script type="module" src="/static/js/animations.js" defer></script>
    
    <!-- Base JavaScript -->
    <script src="/static/js/base.js"></script>
    
    <!-- Namespace Page JavaScript -->
    {{if eq .Page "namespace"}}
    <script src="/static/js/namespace.js"></script>
    {{end}}
</head>
<body class="bg-surface text-on-surface min-h-screen">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 glass border-r border-primary/30 flex flex-col">
            <!-- Logo -->
            <div class="p-6 border-b border-primary/30">
                <h1 class="text-2xl font-bold bg-gradient-to-r from-primary-light via-primary to-secondary-light bg-clip-text text-transparent drop-shadow-[0_0_8px_rgba(196,181,253,0.3)]">
                    Mochi
                </h1>
            </div>
            
            <!-- Navigation -->
            <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
                <a href="/" class="flex items-center space-x-3 px-4 py-2 rounded-lg transition-all text-sm {{if eq .Page "home"}}bg-primary/20 border-l-2 border-primary-light text-primary-light{{else}}hover:bg-primary/10 hover:text-on-surface text-on-surface-subtle{{end}}">
                    <iconify-icon icon="lucide:home" class="text-base"></iconify-icon>
                    <span class="font-medium">Home</span>
                </a>
                
                <!-- Namespaces (expandable) -->
                <div x-data="namespacesNavItems" class="space-y-2">
                    <button @click="open = !open; if (open) loadNamespaces()" class="flex items-center justify-between w-full px-4 py-2 rounded-lg hover:bg-primary/10 hover:text-on-surface text-on-surface-subtle cursor-pointer transition-all text-sm">
                        <div class="flex items-center space-x-3">
                            <iconify-icon icon="lucide:layers" class="text-base"></iconify-icon>
                            <span class="font-medium">Namespaces</span>
                        </div>
                        <iconify-icon icon="lucide:chevron-right" x-show="!open" x-cloak class="text-base transition-transform"></iconify-icon>
                        <iconify-icon icon="lucide:chevron-down" x-show="open" x-cloak class="text-base transition-transform"></iconify-icon>
                    </button>
                    <div x-show="open" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 transform -translate-y-2" x-transition:enter-end="opacity-100 transform translate-y-0" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100 transform translate-y-0" x-transition:leave-end="opacity-0 transform -translate-y-2" class="pl-8 space-y-1 border-l border-primary/20 ml-4">
                        <template x-if="loading">
                            <div class="text-xs text-on-surface-secondary px-4 py-2">Loading...</div>
                        </template>
                        <template x-if="error">
                            <div class="text-xs text-error-light px-4 py-2" x-text="error"></div>
                        </template>
                        <template x-if="!loading && !error && namespaces.length === 0">
                            <div class="text-xs text-on-surface-secondary px-4 py-2">No namespaces found</div>
                        </template>
                        <template x-for="ns in namespaces" :key="ns.name">
                            <a :href="'/namespaces/' + ns.name" 
                               :class="isActive(ns.name) 
                                   ? 'flex items-center justify-between px-4 py-2 rounded-lg bg-primary/20 border-l-2 border-primary-light text-primary-light text-sm font-medium transition-all' 
                                   : 'flex items-center justify-between px-4 py-2 rounded-lg hover:bg-primary/10 hover:text-on-surface-secondary text-on-surface-muted text-sm font-normal transition-all'">
                                <span x-text="ns.name"></span>
                                <span :class="'w-2 h-2 rounded-full ' + getPhaseColor(ns.phase)" 
                                      :title="ns.phase"></span>
                            </a>
                        </template>
                    </div>
                </div>
                
                <!-- Recommendations (expandable) -->
                <div x-data="{ open: true }" class="space-y-2">
                    <button @click="open = !open" class="flex items-center justify-between w-full px-4 py-2 rounded-lg hover:bg-primary/10 hover:text-on-surface text-on-surface-subtle cursor-pointer transition-all text-sm">
                        <div class="flex items-center space-x-3">
                            <iconify-icon icon="lucide:lightbulb" class="text-base"></iconify-icon>
                            <span class="font-medium">Recommendations</span>
                        </div>
                        <iconify-icon icon="lucide:chevron-right" x-show="!open" x-cloak class="text-base transition-transform"></iconify-icon>
                        <iconify-icon icon="lucide:chevron-down" x-show="open" x-cloak class="text-base transition-transform"></iconify-icon>
                    </button>
                    <div x-show="open" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 transform -translate-y-2" x-transition:enter-end="opacity-100 transform translate-y-0" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100 transform translate-y-0" x-transition:leave-end="opacity-0 transform -translate-y-2" class="pl-8 space-y-1 border-l border-primary/20 ml-4">
                        <a href="/recommendations/compute" class="block px-4 py-2 rounded-lg transition-all text-sm {{if eq .Page "recommendations-compute"}}bg-primary/20 border-l-2 border-primary-light text-primary-light font-medium{{else}}hover:bg-primary/10 hover:text-on-surface-secondary text-on-surface-muted font-normal{{end}}">
                            Compute
                        </a>
                    </div>
                </div>
            </nav>
        </aside>
        
        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto">
            {{if eq .Page "home"}}
                {{block "home-content" .}}{{end}}
            {{else if eq .Page "namespace"}}
                {{block "namespace-content" .}}{{end}}
            {{else if eq .Page "error"}}
                {{block "error-content" .}}{{end}}
            {{end}}
        </main>
    </div>
</body>
</html>
