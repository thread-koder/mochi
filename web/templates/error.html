{{template "base.html" .}}

{{define "error-content"}}
<div class="min-h-screen flex items-center justify-center p-8">
    <div class="max-w-2xl w-full">
        <!-- Error Card -->
        <div class="glass rounded-xl p-12 border-error/30">
            <div class="flex flex-col items-center justify-center text-center">
                <div class="mb-8">
                    <div class="w-32 h-32 rounded-full bg-error/20 flex items-center justify-center mb-6">
                        <iconify-icon icon="lucide:alert-circle" class="text-6xl text-error-light"></iconify-icon>
                    </div>
                </div>
                <h1 class="text-4xl font-bold font-heading mb-4 text-error-light">{{.Title}}</h1>
                <p class="text-on-surface-secondary text-xl mb-10 max-w-xl leading-relaxed mx-auto">{{.Message}}</p>
                <div class="flex flex-wrap justify-center gap-4">
                    <a href="/" class="px-8 py-4 rounded-lg bg-primary/20 hover:bg-primary/30 text-primary-light border border-primary/30 transition-all font-medium flex items-center gap-2 text-lg">
                        <iconify-icon icon="lucide:home" class="text-xl"></iconify-icon>
                        Go Home
                    </a>
                    <button onclick="window.history.back()" class="px-8 py-4 rounded-lg bg-surface-elevated hover:bg-primary/10 text-on-surface-secondary hover:text-on-surface border border-primary/20 transition-all font-medium flex items-center gap-2 cursor-pointer text-lg">
                        <iconify-icon icon="lucide:arrow-left" class="text-xl"></iconify-icon>
                        Go Back
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
{{end}}
