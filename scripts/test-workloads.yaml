---
# Backend HTTP server (SVC + Deployment).
apiVersion: v1
kind: Service
metadata:
  name: test-backend
  namespace: mochi-system
spec:
  selector:
    app: test-backend
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-backend
  namespace: mochi-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: test-backend
  template:
    metadata:
      labels:
        app: test-backend
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "64Mi"
---
# Frontend client (Deployment).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-frontend
  namespace: mochi-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-frontend
  template:
    metadata:
      labels:
        app: test-frontend
    spec:
      containers:
        - name: load-generator
          image: curlimages/curl:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              while true; do
                curl -s -o /dev/null http://test-backend/ || true
                sleep 0.5
              done
          resources:
            requests:
              cpu: "25m"
              memory: "64Mi"
---
# Redis cache (SVC + StatefulSet).
apiVersion: v1
kind: Service
metadata:
  name: test-cache
  namespace: mochi-system
spec:
  selector:
    app: test-cache
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: test-cache
  namespace: mochi-system
spec:
  serviceName: test-cache
  replicas: 1
  selector:
    matchLabels:
      app: test-cache
  template:
    metadata:
      labels:
        app: test-cache
    spec:
      containers:
        - name: redis
          image: redis:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
          resources:
            limits:
              cpu: "150m"
              memory: "128Mi"
---
# Worker client (Deployment).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-worker
  namespace: mochi-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-worker
  template:
    metadata:
      labels:
        app: test-worker
    spec:
      containers:
        - name: redis-client
          image: redis:alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              while true; do
                redis-cli -h test-cache ping >/dev/null 2>&1 || true
                sleep 0.5
              done
          resources:
            requests:
              cpu: "25m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
---
# DaemonSet client (DaemonSet).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: test-daemonset
  namespace: mochi-system
spec:
  selector:
    matchLabels:
      app: test-daemonset
  template:
    metadata:
      labels:
        app: test-daemonset
    spec:
      containers:
        - name: load-generator
          image: curlimages/curl:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              while true; do
                curl -s -o /dev/null http://test-backend/ || true
                sleep 0.5
              done
---
# Standalone Pod.
apiVersion: v1
kind: Pod
metadata:
  name: test-standalone-pod
  namespace: mochi-system
spec:
  containers:
    - name: load-generator
      image: curlimages/curl:latest
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - |
          while true; do
            curl -s -o /dev/null http://test-backend/ || true
            sleep 0.5
          done
      resources:
        requests:
          cpu: "25m"
          memory: "64Mi"
