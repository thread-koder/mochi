log:
  level: "info" # debug, info, warn, error
  format: "console" # json, console

api:
  host: "0.0.0.0" # API server host
  port: 8080 # API server port
  read_timeout: 30 # Read timeout in seconds
  write_timeout: 30 # Write timeout in seconds
  mode: "release" # debug, release, test

database:
  host: "localhost"
  port: 5432
  user: "mochi"
  password: "" # Set via MOCHI_DATABASE_PASSWORD env var
  database: "mochi"
  ssl_mode: "disable" # disable, require, verify-ca, verify-full
  max_connections: 25
  max_idle_conns: 5
  conn_max_lifetime: 300 # seconds
  conn_max_idle_time: 60 # seconds

kubernetes:
  kubeconfig_path: "" # Empty = use default (~/.kube/config), or set path to kubeconfig file
  in_cluster: false # Set to true when running as a pod in cluster
  request_timeout: 30 # Request timeout in seconds
  qps: 50 # Queries per second (rate limiting)
  burst: 100 # Burst limit for rate limiting

prometheus:
  url: "http://localhost:9090" # Prometheus server URL
  timeout: 30 # Request timeout in seconds
  insecure_skip_verify: false # Skip TLS certificate verification

