log:
  level: "info" # debug, info, warn, error
  format: "console" # json, console

api:
  host: "0.0.0.0" # API server host
  port: 8080 # API server port
  read_timeout: 30 # Read timeout in seconds
  write_timeout: 30 # Write timeout in seconds
  mode: "release" # debug, release, test

database:
  host: "localhost"
  port: 5432
  user: "mochi"
  password: "" # Set via MOCHI_DATABASE_PASSWORD env var
  database: "mochi"
  ssl_mode: "disable" # disable, require, verify-ca, verify-full
  max_connections: 25
  max_idle_conns: 5
  conn_max_lifetime: 300 # seconds
  conn_max_idle_time: 60 # seconds

kubernetes:
  kubeconfig_path: "" # Empty = use default (~/.kube/config), or set path to kubeconfig file
  in_cluster: false # Set to true when running as a pod in cluster
  request_timeout: 30 # Request timeout in seconds
  qps: 50 # Queries per second (rate limiting)
  burst: 100 # Burst limit (rate limiting)

prometheus:
  url: "http://localhost:9090" # Prometheus server URL
  timeout: 30 # Request timeout in seconds
  insecure_skip_verify: false # Skip TLS certificate verification

redis:
  host: "localhost" # Redis host
  port: 6379 # Redis port
  password: "" # Set via MOCHI_REDIS_PASSWORD env var
  database: 0 # Redis database number (0-15)
  max_retries: 3 # Maximum number of retries
  pool_size: 10 # Connection pool size
  min_idle_conns: 5 # Minimum idle connections
  conn_max_lifetime: 300 # seconds
  conn_max_idle_time: 60 # seconds
  cache_ttl: 300 # Default cache TTL in seconds

workers:
  resource_sync_interval: 180 # Resource sync interval in seconds (3 minutes)
  stale_resource_threshold: 300 # Stale resource threshold in seconds (5 minutes)
  exclude_namespaces: # List of namespaces to exclude from syncing
    - "default"
    - "kube-system"
    - "kube-public"
    - "kube-node-lease"
  include_namespaces: [] # If non-empty, only sync these namespaces (exclude_namespaces ignored)
